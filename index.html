<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OB Performance — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101613; --panel:#1B241E; --panel-2:#212B24; --line:#2E3A31;
    --ink:#F1EDE2; --muted:#93A08F; --gold:#C9A24D;
    --win:#4E9A6C; --loss:#B5533C;
    --fwd:#6B8CAE; --back:#C98A4D;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  .app{display:flex;min-height:100vh;}
  .rail{width:250px;flex:0 0 250px;background:var(--panel);border-right:1px solid var(--line);
        padding:20px 0;overflow-y:auto;max-height:100vh;}
  .rail h1{font-family:'Oswald',sans-serif;font-size:19px;letter-spacing:.3px;margin:0 20px 2px;color:var(--gold);}
  .rail .sub{margin:0 20px 18px;color:var(--muted);font-size:12px;}
  .grp-label{padding:10px 20px 6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .player-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;border-left:3px solid transparent;}
  .player-item:hover{background:var(--panel-2);}
  .player-item.active{background:var(--panel-2);border-left-color:var(--gold);}
  .jersey{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;
          font-family:'Oswald';font-size:12px;font-weight:600;color:#111;flex:0 0 26px;}
  .jersey.Forwards{background:var(--fwd);} .jersey.Backs{background:var(--back);}
  .player-item .name{font-size:13.5px;line-height:1.25;}
  .player-item .pos{font-size:11px;color:var(--muted);}

  .main{flex:1;padding:34px 44px;max-width:980px;}
  .head{display:flex;align-items:baseline;gap:16px;margin-bottom:6px;}
  .head h2{font-family:'Oswald';font-size:34px;margin:0;font-weight:600;}
  .badge{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600;letter-spacing:.3px;}
  .badge.Forwards{background:rgba(107,140,174,.18);color:var(--fwd);}
  .badge.Backs{background:rgba(201,138,77,.18);color:var(--back);}
  .subhead{color:var(--muted);font-size:13px;margin-bottom:28px;}

  .section-title{font-family:'Oswald';font-size:14px;letter-spacing:1.2px;text-transform:uppercase;
                  color:var(--gold);margin:0 0 14px;padding-top:6px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 24px;margin-bottom:26px;}

  .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 24px;}
  .metric{border-bottom:1px solid var(--line);padding-bottom:10px;}
  .metric .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .metric .val{font-family:'Oswald';font-size:22px;margin-top:2px;}
  .metric .val .unit{font-size:12px;color:var(--muted);font-family:'Inter';margin-left:3px;}
  .metric .bar-track{margin-top:8px;height:5px;border-radius:3px;background:var(--panel-2);overflow:hidden;}
  .metric .bar-fill{height:100%;border-radius:3px;background:var(--gold);}
  .metric .cmp{font-size:10.5px;color:var(--muted);margin-top:4px;}
  .na{color:var(--muted);font-style:italic;font-size:13px;}

  .gps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:20px;}
  .gps-card .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
  .pair{display:flex;align-items:flex-end;gap:10px;height:100px;}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .colbar{width:100%;border-radius:5px 5px 0 0;min-height:2px;}
  .colbar.win{background:var(--win);} .colbar.loss{background:var(--loss);}
  .col .n{font-family:'Oswald';font-size:14px;margin-bottom:4px;}
  .col .t{font-size:10.5px;color:var(--muted);margin-top:6px;}

  .warn{font-size:12px;color:#D8A15C;background:rgba(201,164,77,.08);border:1px solid rgba(201,164,77,.25);
        border-radius:8px;padding:10px 14px;margin-bottom:20px;}

  .corr-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .corr-row:last-child{border-bottom:none;}
  .corr-row .pair-txt{flex:1;color:var(--ink);}
  .corr-row .pair-txt b{color:var(--gold);font-weight:600;}
  .corr-row .rbar-track{width:110px;height:8px;background:var(--panel-2);border-radius:4px;position:relative;overflow:hidden;flex:0 0 110px;}
  .corr-row .rbar-fill{position:absolute;top:0;bottom:0;border-radius:4px;}
  .corr-row .rval{width:44px;text-align:right;font-family:'Oswald';font-size:13px;flex:0 0 44px;}
  .corr-note{font-size:11.5px;color:var(--muted);margin-top:12px;}

  @media (max-width:760px){
    .app{flex-direction:column;}
    .rail{width:100%;flex:none;max-height:260px;border-right:none;border-bottom:1px solid var(--line);}
    .main{padding:24px 18px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="rail" id="rail">
    <h1>OB Performance</h1>
    <p class="sub">Tests físicos × rendimiento en partidos</p>
    <div id="rail-list"></div>
  </div>
  <div class="main" id="main"></div>
</div>

const CORR = [{"Test fisico": "30m (s)", "Metrica GPS": "GPS Ganados - Aceleraciones", "n": 14, "r": -0.76}, {"Test fisico": "Masa (kg)", "Metrica GPS": "GPS Ganados - Aceleraciones", "n": 15, "r": -0.65}, {"Test fisico": "Flexibilidad (cm)", "Metrica GPS": "GPS Ganados - PlayerLoad", "n": 14, "r": 0.65}, {"Test fisico": "Bronco test (min)", "Metrica GPS": "GPS Perdidos - Aceleraciones", "n": 14, "r": -0.61}, {"Test fisico": "Masa Grasa (kg)", "Metrica GPS": "GPS Ganados - Aceleraciones", "n": 15, "r": -0.59}, {"Test fisico": "Masa Muscular (%)", "Metrica GPS": "GPS Ganados - Aceleraciones", "n": 15, "r": 0.57}, {"Test fisico": "Bronco test (min)", "Metrica GPS": "GPS Ganados - Aceleraciones", "n": 14, "r": -0.57}, {"Test fisico": "Masa (kg)", "Metrica GPS": "GPS Perdidos - Aceleraciones", "n": 15, "r": -0.56}, {"Test fisico": "Masa Grasa (%)", "Metrica GPS": "GPS Ganados - Aceleraciones", "n": 15, "r": -0.54}, {"Test fisico": "Masa Muscular (kg)", "Metrica GPS": "GPS Ganados - Aceleraciones", "n": 15, "r": -0.53}];

function fmt(v, d=1){
  if(v===null || v===undefined || isNaN(v)) return null;
  return Number(v).toFixed(d);
}
function avg(arr){ const v=arr.filter(x=>x!==null && x!==undefined && !isNaN(x)); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; }

const teamAvg = {};
['Masa (kg)','Talla (cm)','Masa Muscular (kg)','Masa Muscular (%)','Masa Grasa (%)','1RM Sentadilla (kg)','1RM Press Banca (kg)',
 '1RM Peso Muerto (kg)','1RM Remo (kg)','30m (s)','Flexibilidad (cm)','Bronco test (min)',
 'IMTP Peak Force (N)','CMJ Altura (cm)','DropJump RSI'].forEach(k=>{
  teamAvg[k] = avg(PLAYERS.map(p=>p[k]));
});

let current = PLAYERS[0].Jugador;

function renderRail(){
  const groups = {Forwards:[], Backs:[]};
  PLAYERS.slice().sort((a,b)=>a.Jugador.localeCompare(b.Jugador)).forEach(p=>groups[p.Posicion].push(p));
  let html = '';
  ['Forwards','Backs'].forEach(pos=>{
    html += `<div class="grp-label">${pos}</div>`;
    groups[pos].forEach(p=>{
      const initials = p.Jugador.split(' ').map(w=>w[0]).slice(0,2).join('');
      html += `<div class="player-item ${p.Jugador===current?'active':''}" data-name="${p.Jugador}">
        <div class="jersey ${p.Posicion}">${initials}</div>
        <div><div class="name">${p.Jugador}</div><div class="pos">${p.Posicion}</div></div>
      </div>`;
    });
  });
  document.getElementById('rail-list').innerHTML = html;
  document.querySelectorAll('.player-item').forEach(el=>{
    el.addEventListener('click', ()=>{ current = el.dataset.name; renderRail(); renderMain(); });
  });
}

function metricRow(label, val, unit, key, decimals=1, higherIsBetter=true){
  const v = fmt(val, decimals);
  const ta = teamAvg[key];
  if(v===null){
    return `<div class="metric"><div class="lbl">${label}</div><div class="na">sin dato</div></div>`;
  }
  let pct = 50, cmp = '';
  if(ta && ta!==0){
    const ratio = val/ta;
    pct = Math.max(6, Math.min(100, ratio*50));
    const diff = ((val-ta)/ta*100);
    const sign = diff>=0? '+':'';
    cmp = `${sign}${diff.toFixed(0)}% vs promedio equipo`;
  }
  return `<div class="metric">
    <div class="lbl">${label}</div>
    <div class="val">${v}<span class="unit">${unit}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="cmp">${cmp}</div>
  </div>`;
}

function gpsPair(label, winVal, lossVal, unit, decimals=0){
  const w = fmt(winVal, decimals), l = fmt(lossVal, decimals);
  if(w===null && l===null){
    return `<div class="gps-card"><div class="lbl">${label}</div><div class="na">sin dato</div></div>`;
  }
  const max = Math.max(winVal||0, lossVal||0, 0.0001);
  const wh = winVal? Math.max(6,(winVal/max)*100) : 2;
  const lh = lossVal? Math.max(6,(lossVal/max)*100) : 2;
  return `<div class="gps-card">
    <div class="lbl">${label}</div>
    <div class="pair">
      <div class="col"><div class="n">${w??'–'}</div><div class="colbar win" style="height:${wh}%"></div><div class="t">Ganados</div></div>
      <div class="col"><div class="n">${l??'–'}</div><div class="colbar loss" style="height:${lh}%"></div><div class="t">Perdidos</div></div>
    </div>
  </div>`;
}

function corrLabel(s){
  return s.replace('GPS Ganados - ','G · ').replace('GPS Perdidos - ','P · ');
}

function renderCorr(){
  let rows = CORR.slice(0,10).map(c=>{
    const width = Math.abs(c.r)*50; // r in [-1,1] -> up to 50% each side
    const positive = c.r >= 0;
    const left = positive ? 55 : 55-width;
    return `<div class="corr-row">
      <div class="pair-txt"><b>${c['Test fisico']}</b> ↔ ${corrLabel(c['Metrica GPS'])} <span style="color:var(--muted)">(n=${c.n})</span></div>
      <div class="rbar-track"><div class="rbar-fill" style="left:${left}%; width:${width}%; background:${positive?'var(--win)':'var(--loss)'}"></div></div>
      <div class="rval" style="color:${positive?'var(--win)':'var(--loss)'}">${c.r>0?'+':''}${c.r}</div>
    </div>`;
  }).join('');
  return `<div class="panel">
    <div class="section-title">Relación tests físicos ↔ rendimiento en partidos (equipo, n≤15)</div>
    ${rows}
    <div class="corr-note">Correlación de Pearson entre cada test físico y las métricas GPS promedio en partidos ganados/perdidos. Con esta muestra (n≈14–15) son señales orientativas, no relaciones confirmadas.</div>
  </div>`;
}

function renderMain(){
  const p = PLAYERS.find(x=>x.Jugador===current);
  const outlierNote = (p.Jugador==='Juan Fischer' || p.Jugador==='Clemente Videla')
    ? `<div class="warn">⚠ La distancia GPS en partidos ganados de este jugador es un valor atípico en el archivo original (posible error de tipeo) — revisar la fuente antes de usarla en un informe.</div>` : '';

  document.getElementById('main').innerHTML = `
    <div class="head">
      <h2>${p.Jugador}</h2>
      <span class="badge ${p.Posicion}">${p.Posicion}</span>
    </div>
    <div class="subhead">${fmt(p.Edad,1)||'–'} años · ${fmt(p['Masa (kg)'],1)||'–'} kg · ${fmt(p['Talla (cm)'],0)||'–'} cm</div>

    ${outlierNote}

    <div class="section-title">Perfil físico</div>
    <div class="panel metric-grid">
      ${metricRow('Masa muscular (kg)', p['Masa Muscular (kg)'], 'kg', 'Masa Muscular (kg)', 1)}
      ${metricRow('Masa muscular (%)', p['Masa Muscular (%)'], '%', 'Masa Muscular (%)', 1)}
      ${metricRow('Masa grasa (%)', p['Masa Grasa (%)'], '%', 'Masa Grasa (%)', 1)}
      ${metricRow('1RM Sentadilla', p['1RM Sentadilla (kg)'], 'kg', '1RM Sentadilla (kg)', 0)}
      ${metricRow('1RM Press banca', p['1RM Press Banca (kg)'], 'kg', '1RM Press Banca (kg)', 0)}
      ${metricRow('1RM Peso muerto', p['1RM Peso Muerto (kg)'], 'kg', '1RM Peso Muerto (kg)', 0)}
      ${metricRow('1RM Remo', p['1RM Remo (kg)'], 'kg', '1RM Remo (kg)', 0)}
      ${metricRow('30 metros', p['30m (s)'], 's', '30m (s)', 2)}
      ${metricRow('Bronco test', p['Bronco test (min)'], 'min', 'Bronco test (min)', 2)}
      ${metricRow('Flexibilidad', p['Flexibilidad (cm)'], 'cm', 'Flexibilidad (cm)', 0)}
      ${metricRow('CMJ altura', p['CMJ Altura (cm)'], 'cm', 'CMJ Altura (cm)', 1)}
      ${metricRow('IMTP fuerza pico', p['IMTP Peak Force (N)'], 'N', 'IMTP Peak Force (N)', 0)}
      ${metricRow('DropJump RSI', p['DropJump RSI'], '', 'DropJump RSI', 2)}
    </div>

    <div class="section-title">Rendimiento GPS: partidos ganados vs perdidos</div>
    <div class="panel gps-grid">
      ${gpsPair('Distancia', p['GPS Ganados - Distancia (m)'], p['GPS Perdidos - Distancia (m)'], 'm', 0)}
      ${gpsPair('Aceleraciones', p['GPS Ganados - Aceleraciones'], p['GPS Perdidos - Aceleraciones'], '', 0)}
      ${gpsPair('Impactos', p['GPS Ganados - Impactos'], p['GPS Perdidos - Impactos'], '', 1)}
      ${gpsPair('Player Load', p['GPS Ganados - PlayerLoad'], p['GPS Perdidos - PlayerLoad'], '', 0)}
      ${gpsPair('Vel. máxima', p['GPS Ganados - Vel Max (km/h)'], p['GPS Perdidos - Vel Max (km/h)'], 'km/h', 1)}
    </div>

    ${renderCorr()}
  `;
}

renderRail();
renderMain();
</script>
